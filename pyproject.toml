[project]
name = "jean"
version = "0.1.0"
description = "Jean — lightweight, event-driven field observer for the Fabric cognitive OS"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "structlog>=24.0",
    "python-ulid>=2.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
jean-agent = "jean.agent.main:main"
jean-aggregator = "jean.aggregator.main:main"
jean-validator = "jean.validator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jean"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
