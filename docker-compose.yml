services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jean
      POSTGRES_PASSWORD: jean
      POSTGRES_DB: jean
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jean -d jean"]
      interval: 5s
      timeout: 3s
      retries: 5

  aggregator:
    build: .
    command: jean-aggregator
    ports:
      - "8100:8100"
    environment:
      - JEAN_LOG_LEVEL=info
      - JEAN_STORE=postgres
      - JEAN_PG_DSN=postgresql://jean:jean@postgres/jean
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  validator:
    build: .
    command: jean-validator
    ports:
      - "8200:8200"
    environment:
      - JEAN_LOG_LEVEL=info
      - JEAN_FLOWFABRIC_WEBHOOK=${JEAN_FLOWFABRIC_WEBHOOK:-}
    depends_on:
      aggregator:
        condition: service_healthy

  # jean-agent runs on each workstation — not in compose for production
  # This service is for local development/testing only
  agent-dev:
    build: .
    command: jean-agent
    environment:
      - JEAN_AGGREGATOR_URL=http://aggregator:8100
      - JEAN_PROCESS_CONTEXT=invoice-exception
      - JEAN_WORKSTATION_ID=dev-workstation-001
      - JEAN_BUFFER_PATH=/data/jean-agent.db
    volumes:
      - agent-data:/data
    depends_on:
      aggregator:
        condition: service_healthy

volumes:
  pg-data:
  agent-data:
